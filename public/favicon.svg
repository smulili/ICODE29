<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;display=swap');
    
    .terminal-bold { 
      font-family: 'JetBrains Mono', monospace; 
      font-weight: 800; 
    }
  </style>

  <!-- Background Circle filling the canvas -->
  <circle cx="70" cy="70" r="70" fill="#101C28"/>
  
  <!-- Slanted 'i' bar centered horizontally -->
  <rect x="60" y="16" width="20" height="78" fill="#C2D501" rx="5" transform="rotate(15, 70, 55)"/>
  
  <!-- '_29' text raised to align directly at the base/leg of the slanted 'i' -->
  <text x="115" y="96" class="terminal-bold" font-size="22" fill="#C2D501" text-anchor="end">_29</text>
</svg>
