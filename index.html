<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>InvCode 29 | Software Development, Consulting & API Integration</title>

    <meta
      name="description"
      content="InvCode 29 is a technology company specializing in software development, website development, mobile applications, API integrations, AI solutions and digital consulting."
    />

    <meta
      name="keywords"
      content="InvCode 29, software development, web development, mobile app development, API integration, AI solutions, fintech, technology consulting, digital solutions"
    />

    <meta name="author" content="InvCode 29" />

    <!-- Search engine instructions -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://YOURDOMAIN.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo4.svg" />

    <!-- Open Graph / Facebook -->
    <meta
      property="og:title"
      content="InvCode 29 | Software Development, Consulting & API Integration"
    />

    <meta
      property="og:description"
      content="Custom software development, websites, mobile applications, AI solutions, API integrations and digital solutions for modern businesses."
    />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://YOURDOMAIN.com/" />

    <meta
      property="og:image"
      content="https://YOURDOMAIN.com/logo2.png"
    />

    <meta property="og:site_name" content="InvCode 29" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="InvCode 29 | Software Development, Consulting & API Integration"
    />

    <meta
      name="twitter:description"
      content="Custom software development, websites, mobile applications, AI solutions, API integrations and digital solutions."
    />

    <meta
      name="twitter:image"
      content="https://YOURDOMAIN.com/logo2.png"
    />

    <!-- Google WebSite structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "InvCode 29",
        "alternateName": "InvCode29",
        "url": "https://YOURDOMAIN.com/"
      }
    </script>

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "InvCode 29",
        "alternateName": "InvCode29",
        "url": "https://YOURDOMAIN.com/",
        "logo": "https://YOURDOMAIN.com/logo2.png",
        "description": "InvCode 29 is a technology company specializing in software development, website development, mobile applications, API integrations, AI solutions and digital consulting.",
        "sameAs": [
          "https://www.linkedin.com/company/invcode-29/",
          "https://www.facebook.com/YOUR_PAGE",
          "https://www.instagram.com/YOUR_PAGE"
        ],
        "knowsAbout": [
          "Software Development",
          "Web Development",
          "Mobile App Development",
          "API Integration",
          "Artificial Intelligence",
          "Fintech",
          "Digital Solutions",
          "Technology Consulting"
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
